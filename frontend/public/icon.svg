<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .car-body { fill: #0f172a; }
    .car-window { fill: #ffffff; opacity: 0.9; }
    .car-accent { fill: #2563eb; }
    .car-taillight { fill: #ef4444; }
    .car-wheel-outer { fill: #0f172a; }
    .car-wheel-inner { fill: #ffffff; }
    .car-wheel-rim { fill: #2563eb; }

    @media (prefers-color-scheme: dark) {
      .car-body { fill: #f8fafc; }
      .car-window { fill: #0f172a; }
      .car-accent { fill: #38bdf8; }
      .car-taillight { fill: #ef4444; }
      .car-wheel-outer { fill: #f8fafc; }
      .car-wheel-inner { fill: #0f172a; }
      .car-wheel-rim { fill: #38bdf8; }
    }
  </style>

  <!-- Car Body Silhouette -->
  <path class="car-body" fill="#0f172a" d="M 2.5 22.5 C 1.5 22 1.5 18 2.5 17 C 3.5 16 7 15 10.5 13.2 C 12.2 11.5 14 8.5 16.5 8.5 C 19.5 8.5 22 8.8 23.5 10 C 25.2 11.4 27.5 14 29 16.5 C 30.5 18 30.5 20.5 29.5 21.8 C 28.8 22.5 28 22.5 27.5 22.5 A 4.2 4.2 0 0 0 19.5 22.5 L 12.5 22.5 A 4.2 4.2 0 0 0 4.5 22.5 Z" />

  <!-- Aerodynamic Windows -->
  <path class="car-window" fill="#ffffff" opacity="0.9" d="M 11.5 13.5 L 14.8 10.2 C 15.4 10.2 16.2 10.2 16.8 10.2 L 16.8 13.8 L 11.5 13.5 Z" />
  <path class="car-window" fill="#ffffff" opacity="0.9" d="M 18.2 10.2 C 19.8 10.2 21.5 10.6 22.8 11.8 L 25.6 13.8 L 18.2 13.8 Z" />

  <!-- Headlight Accent -->
  <path class="car-accent" fill="#2563eb" d="M 2.2 17.5 L 5.2 16.8 L 4.8 18 Z" />
  <!-- Taillight Accent -->
  <path class="car-taillight" fill="#ef4444" d="M 29.8 17.5 L 27.8 17.2 L 28 18.2 Z" />

  <!-- Front Wheel -->
  <circle class="car-wheel-outer" cx="8.5" cy="22.5" r="3.6" fill="#0f172a" />
  <circle class="car-wheel-inner" cx="8.5" cy="22.5" r="2.2" fill="#ffffff" />
  <circle class="car-wheel-rim" cx="8.5" cy="22.5" r="1.3" fill="#2563eb" />

  <!-- Rear Wheel -->
  <circle class="car-wheel-outer" cx="23.5" cy="22.5" r="3.6" fill="#0f172a" />
  <circle class="car-wheel-inner" cx="23.5" cy="22.5" r="2.2" fill="#ffffff" />
  <circle class="car-wheel-rim" cx="23.5" cy="22.5" r="1.3" fill="#2563eb" />
</svg>
